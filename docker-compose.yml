services:
  office-postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: office_feedback, POSTGRES_PASSWORD: postgres}
  office-api:
    build: .
    ports: ["8083:8080"]
    environment: {OFFICE_DATABASE_URL: "postgres://postgres:postgres@office-postgres:5432/office_feedback?sslmode=disable"}
    depends_on: [office-postgres]
